# gm4：pipeline 目前使用的環境（DGX Spark / GB10，aarch64，CUDA 13）。
# 由 `conda env export -n gm4 --no-builds` 產生（2026-10-13）。
#   conda env create -f environment.yml
# 注意：
#   - torchvision 等 +cu130 套件來自 PyTorch 的 cu130 index（下面 pip 區段已加上 --extra-index-url）。
#   - flash-attn（Evo2 的 vortex 需要）不在這裡：aarch64 沒有預編譯 wheel，必須在 torch 裝好之後
#     以 --no-build-isolation 從原始碼編譯，setup_and_run.sh 的 env 步驟會自動處理：
#       pip install flash-attn==2.8.3 --no-build-isolation
#   - Evo2 分數與 gm3（FP8）環境約差 1e-4，請與產生 site 分數的環境一致。
